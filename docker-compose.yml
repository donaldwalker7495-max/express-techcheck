version: '3.9'

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/0_schema.sql:ro

  api:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  db_data:
